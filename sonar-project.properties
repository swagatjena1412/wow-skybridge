sonar.organization=swagatjena1412
sonar.projectKey=swagatjena1412_wow-skybridge
sonar.projectName=Skybridge
sonar.projectVersion=1.0

# Source layout
sonar.sources=app,components,lib,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts,tests/**/*.test.tsx,tests/**/*.spec.ts,tests/**/*.spec.tsx

# Coverage report (vitest writes lcov to ./coverage/lcov.info)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions — generated files, third-party, type defs
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/coverage/**,\
  **/out/**,\
  **/.lighthouseci/**,\
  **/*.d.ts,\
  components/ui/**,\
  public/**

# Test exclusions from coverage measurement
sonar.coverage.exclusions=\
  app/layout.tsx,\
  components/RegisterSW.tsx,\
  components/ThemeProvider.tsx,\
  lib/utils.ts,\
  scripts/**,\
  tests/**
